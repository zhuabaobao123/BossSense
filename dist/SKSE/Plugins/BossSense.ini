; Boss Sense —— 动态 Boss 识别（TrueHUD）
; 编码：UTF-8（无 BOM）；换行：CRLF
;
; 本文件在游戏启动时读取；游戏内菜单（SKSE Menu Framework）修改参数后会自动写回这里。
;
; 规则：一个敌对目标的得分 >= [Thresholds] Threshold，就判定为 Boss，给 TrueHUD 加 Boss 血条。
; 把 [Weights] 里任意一项设为 0，等于关闭该信号。

[General]
; 总开关。0 = 完全停用（不判定、不加血条）
Enabled = 1
; 1 = 只判定对玩家敌对的目标（随从、友军、任务 NPC 直接排除）
OnlyHostile = 1
; 1 = 只在目标处于战斗状态时才判定；0 = 进入战斗或被打中时都判定
RequireCombat = 0
; 1 = 把每次判定的得分明细写进日志（Documents\My Games\Skyrim Special Edition\SKSE\BossSense.log）
DebugLog = 0
; 界面语言不在这里设置：同目录的 BossSense.json 就是翻译文件，删掉它即恢复英文。

[Thresholds]
; 判定阈值：得分达到这个数才算 Boss。调高 = 更严格，调低 = 更容易出 Boss 条
Threshold = 70
; “等级高于玩家”信号：目标等级 >= 玩家等级 + 这个值时才加分
LevelDelta = 5
; “血量阈值”信号：目标最大生命 >= 这个值时才加分
HealthMin = 400

[Weights]
; ---- 强证据：任意一条单独就能达到默认阈值 ----
; 种族白名单：龙、龙祭司、吸血鬼大君、Miraak 等，见 [Lists] BossRace
Race = 100
; 地点 Boss 标记：目标就是当前地点 LocRefType Boss / DLC2Boss1 标记的那个引用（副本 Boss 的标准做法）
LocRef = 100
; EditorID 含 boss：DLL 在加载时自己解析插件文件的 NPC_ 记录（不依赖运行时 EditorID）
Edid = 90
; 手工命名 NPC：EDID 不以 Lvl/Enc 开头，说明是作者手写的角色而不是通用刷怪模板
CustomName = 25
; 非刷怪模板：不是从 Lvl... 随机刷怪列表生成，而是手工放置/任务指定的 NPC
NotLeveled = 20

; ---- 辅助证据：需要几条叠加才能达到阈值 ----
; Unique（唯一）标记
Unique = 20
; 等级 >= 玩家等级 + LevelDelta
Level = 20
; 最大生命 >= HealthMin
Health = 20
; AIDT：侵略性 >= 非常激进 且 自信 = 鲁莽（你旧脚本的规则 B，这里只作为弱证据）
Aidt = 10
; 有名字（非空 FULL）
Named = 10

[Lists]
; 永远判定为 Boss 的种族，写法：插件名.esp:0xFormID
BossRace = Skyrim.esm:0x012E82
BossRace = Skyrim.esm:0x0131EF
BossRace = Skyrim.esm:0x0E7713
BossRace = Skyrim.esm:0x0EBE18
BossRace = Skyrim.esm:0x1052A3
BossRace = Dawnguard.esm:0x00283A
BossRace = Dawnguard.esm:0x010D00
BossRace = Dawnguard.esm:0x0117DE
BossRace = Dawnguard.esm:0x015C34
BossRace = Dragonborn.esm:0x01F98F
BossRace = Dragonborn.esm:0x02C88B
BossRace = Dragonborn.esm:0x02C88C
BossRace = Dragonborn.esm:0x03911A
BossRace = Dragonborn.esm:0x03CA97

; 黑名单：永远不出 Boss 血条（NPC_ 或种族都可以）
; 游戏内菜单的“永不 Boss”按钮会自动往这里加
;Blacklist = SomeMod.esp:0x001234

; 白名单：永远出 Boss 血条
; 游戏内菜单的“永远 Boss”按钮会自动往这里加
;Whitelist = SomeMod.esp:0x005678
